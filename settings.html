<!DOCTYPE html>
<html lang="en">
<!-- The text is filled in from _locales/<language>/messages.json by
     settings.js (data-i18n* attributes) -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="settingsPageTitle"></title>
  <link rel="icon" href="images/icon32.png">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="window">
    <!-- The shake squiggles from the extension icon -->
    <svg class="squiggle squiggle-left" viewBox="0 0 52 90" aria-hidden="true">
      <path d="M16 4c-10 8 10 14 0 22s10 14 0 22 10 14 0 22 10 14 0 16"/>
      <path d="M38 16c-8 6 8 11 0 17s8 11 0 17 8 11 0 17"/>
    </svg>
    <svg class="squiggle squiggle-right" viewBox="0 0 100 46" aria-hidden="true">
      <path d="M4 14c8-10 14 10 22 0s14 10 22 0 14 10 22 0 10 8 16 0"/>
      <path d="M18 34c7-8 12 8 19 0s12 8 19 0 12 8 19 0"/>
    </svg>

    <header class="titlebar">
      <h1 data-i18n="settingsHeading"></h1>
    </header>

    <div class="content">

      <section class="group movement" aria-labelledby="movement-title">
        <h2 id="movement-title" data-i18n="physicsSettings"></h2>

        <div class="setting">
          <label for="gravity" data-i18n="gravity"></label>
          <span class="value"><input type="number" class="value-input" id="gravityValue" min="0" max="2" step="0.1" value="0" data-i18n-aria-label="gravity"></span>
          <input type="range" class="slider" id="gravity" min="0" max="2" step="0.1" value="0" aria-describedby="gravity-hint">
          <p class="hint" id="gravity-hint" data-i18n="gravityHint"></p>
        </div>

        <div class="setting">
          <label for="frictionAir" data-i18n="airDrag"></label>
          <span class="value"><input type="number" class="value-input" id="frictionAirValue" min="0" max="0.1" step="0.005" value="0.02" data-i18n-aria-label="airDrag"></span>
          <input type="range" class="slider" id="frictionAir" min="0" max="0.1" step="0.005" value="0.02" aria-describedby="frictionAir-hint">
          <p class="hint" id="frictionAir-hint" data-i18n="airDragHint"></p>
        </div>

        <div class="setting">
          <label for="restitution" data-i18n="bounce"></label>
          <span class="value"><input type="number" class="value-input" id="restitutionValue" min="0" max="1" step="0.1" value="0.5" data-i18n-aria-label="bounce"></span>
          <input type="range" class="slider" id="restitution" min="0" max="1" step="0.1" value="0.5" aria-describedby="restitution-hint">
          <p class="hint" id="restitution-hint" data-i18n="bounceHint"></p>
        </div>

        <div class="setting">
          <label for="friction" data-i18n="friction"></label>
          <span class="value"><input type="number" class="value-input" id="frictionValue" min="0" max="1" step="0.1" value="0.1" data-i18n-aria-label="friction"></span>
          <input type="range" class="slider" id="friction" min="0" max="1" step="0.1" value="0.1" aria-describedby="friction-hint">
          <p class="hint" id="friction-hint" data-i18n="frictionHint"></p>
        </div>

        <div class="setting">
          <label for="density" data-i18n="weight"></label>
          <span class="value"><input type="number" class="value-input" id="densityValue" min="0.001" max="0.01" step="0.001" value="0.001" data-i18n-aria-label="weight"></span>
          <input type="range" class="slider" id="density" min="0.001" max="0.01" step="0.001" value="0.001" aria-describedby="density-hint">
          <p class="hint" id="density-hint" data-i18n="weightHint"></p>
        </div>

        <div class="setting">
          <label for="stiffness" data-i18n="dragStrength"></label>
          <span class="value"><input type="number" class="value-input" id="stiffnessValue" min="0.1" max="1" step="0.1" value="0.2" data-i18n-aria-label="dragStrength"></span>
          <input type="range" class="slider" id="stiffness" min="0.1" max="1" step="0.1" value="0.2" aria-describedby="stiffness-hint">
          <p class="hint" id="stiffness-hint" data-i18n="dragStrengthHint"></p>
        </div>
      </section>

      <section class="group shaking" aria-labelledby="shaking-title">
        <h2 id="shaking-title" data-i18n="shakeSettings"></h2>

        <div class="setting">
          <label for="shakeDistance" data-i18n="shakeDistance"></label>
          <span class="value"><input type="number" class="value-input" id="shakeDistanceValue" min="10" max="150" step="5" value="40" data-i18n-aria-label="shakeDistanceField"><span class="unit" aria-hidden="true" data-i18n="unitPx"></span></span>
          <input type="range" class="slider" id="shakeDistance" min="10" max="150" step="5" value="40" data-unit="px" aria-describedby="shakeDistance-hint">
          <p class="hint" id="shakeDistance-hint" data-i18n="shakeDistanceHint"></p>
        </div>

        <div class="setting">
          <label for="minShakeSpeed" data-i18n="shakeSpeed"></label>
          <span class="value"><input type="number" class="value-input" id="minShakeSpeedValue" min="100" max="1000" step="50" value="150" data-i18n-aria-label="shakeSpeedField"><span class="unit" aria-hidden="true" data-i18n="unitPxPerSecond"></span></span>
          <input type="range" class="slider" id="minShakeSpeed" min="100" max="1000" step="50" value="150" data-unit="px/s" aria-describedby="minShakeSpeed-hint">
          <p class="hint" id="minShakeSpeed-hint" data-i18n="shakeSpeedHint"></p>
        </div>

        <div class="setting">
          <label for="requiredShakes" data-i18n="shakesNeeded"></label>
          <span class="value"><input type="number" class="value-input" id="requiredShakesValue" min="2" max="10" step="1" value="4" data-i18n-aria-label="shakesNeeded"></span>
          <input type="range" class="slider" id="requiredShakes" min="2" max="10" step="1" value="4" aria-describedby="requiredShakes-hint">
          <p class="hint" id="requiredShakes-hint" data-i18n="shakesNeededHint"></p>
        </div>

        <div class="setting">
          <label for="timeWindow" data-i18n="timeToShake"></label>
          <span class="value"><input type="number" class="value-input" id="timeWindowValue" min="500" max="3000" step="100" value="1500" data-i18n-aria-label="timeToShakeField"><span class="unit" aria-hidden="true" data-i18n="unitMs"></span></span>
          <input type="range" class="slider" id="timeWindow" min="500" max="3000" step="100" value="1500" data-unit="ms" aria-describedby="timeWindow-hint">
          <p class="hint" id="timeWindow-hint" data-i18n="timeToShakeHint"><span data-value-of="requiredShakes">4</span></p>
        </div>

        <div class="setting">
          <label for="hideRestoreButton" data-i18n="hideRestoreButton"></label>
          <span class="switch">
            <input type="checkbox" id="hideRestoreButton" role="switch" aria-describedby="hideRestoreButton-hint">
            <span class="switch-track" aria-hidden="true"></span>
          </span>
          <p class="hint" id="hideRestoreButton-hint" data-i18n="hideRestoreButtonHint"></p>
        </div>

      </section>

      <aside class="tip">
        <p data-i18n-html="tipStart"></p>
        <br/>
        <p data-i18n-html="tipRestore"></p>
      </aside>

      <button type="button" class="reset" id="resetSettings" data-i18n="resetSettings"></button>
      <p class="visually-hidden" role="status" id="status"></p>
    </div>
  </main>
  <script src="defaults.js"></script>
  <script src="settings.js"></script>
</body>
</html>
