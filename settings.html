<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="settings-container">
    <h2>Physics Settings</h2>
    <div class="setting-group">
      <label class="setting-label">
        Gravity
        <span class="setting-value" id="gravityValue">0.5</span>
      </label>
      <input type="range" class="slider" id="gravity" min="0" max="2" step="0.1" value="0.5">
    </div>
    
    <div class="setting-group">
      <label class="setting-label">
        Bounce (Restitution)
        <span class="setting-value" id="restitutionValue">0.7</span>
      </label>
      <input type="range" class="slider" id="restitution" min="0" max="1" step="0.1" value="0.7">
    </div>
    
    <div class="setting-group">
      <label class="setting-label">
        Friction
        <span class="setting-value" id="frictionValue">0.3</span>
      </label>
      <input type="range" class="slider" id="friction" min="0" max="1" step="0.1" value="0.3">
    </div>
    
    <div class="setting-group">
      <label class="setting-label">
        Density
        <span class="setting-value" id="densityValue">0.001</span>
      </label>
      <input type="range" class="slider" id="density" min="0.001" max="0.01" step="0.001" value="0.001">
    </div>
    
    <div class="setting-group">
      <label class="setting-label">
        Drag Stiffness
        <span class="setting-value" id="stiffnessValue">0.2</span>
      </label>
      <input type="range" class="slider" id="stiffness" min="0.1" max="1" step="0.1" value="0.2">
    </div>

    <h2>Shake Detection Settings</h2>
    <div class="setting-group">
      <label class="setting-label">
        Shake Sensitivity (px)
        <span class="setting-value" id="shakeThresholdValue">100</span>
      </label>
      <input type="range" class="slider" id="shakeThreshold" min="50" max="200" step="10" value="100">
    </div>

    <div class="setting-group">
      <label class="setting-label">
        Required Shakes
        <span class="setting-value" id="requiredShakesValue">5</span>
      </label>
      <input type="range" class="slider" id="requiredShakes" min="2" max="10" step="1" value="5">
    </div>

    <div class="setting-group">
      <label class="setting-label">
        Shake Time Window (ms)
        <span class="setting-value" id="timeWindowValue">1000</span>
      </label>
      <input type="range" class="slider" id="timeWindow" min="500" max="2000" step="100" value="1000">
    </div>

    <div class="button-group">
      <button class="toggle-button" id="togglePhysics">Toggle ON Physics</button>
      <button class="reset-button" id="resetSettings">Reset All Settings</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
