name: Build

# Reusable: tests, packages and lints the extension, then uploads one package
# per browser as the `extension-chrome` and `extension-firefox` artifacts.
# Called by CI (staging / PRs), which runs the tests, and Release (main),
# which doesn't: main only takes pull requests whose CI already tested the
# merged result.
on:
  workflow_call:
    inputs:
      run-tests:
        description: Run the unit and browser tests
        type: boolean
        default: true
    outputs:
      version:
        description: Version from manifest.json
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - id: version
        name: Read manifest version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Only the tests need these; packaging uses Node built-ins
      - name: Install dependencies
        if: inputs.run-tests
        run: npm ci

      # scripts/package.js holds the list of shipped files (the e2e tests load
      # the extension from the same list). Both packages are Manifest V3; the
      # Firefox one declares background scripts instead of a service worker.
      - name: Package
        run: |
          npm run build:chrome
          npm run build:firefox

      - name: Syntax check
        run: for f in build/chrome/*.js; do node --check "$f"; done

      - name: Unit tests
        if: inputs.run-tests
        run: npm run test:unit

      - name: Install Chromium
        if: inputs.run-tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: inputs.run-tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && inputs.run-tests
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # One warning is expected: the Chrome-only chrome.dom call, which is
      # feature-detected
      - name: Lint for Firefox
        run: npx --yes web-ext@8.10.0 lint --source-dir build/firefox

      # The packaged folders themselves: upload-artifact zips them, so
      # downloading an artifact gives a ready-to-upload extension zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-chrome
          path: build/chrome/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-firefox
          path: build/firefox/
          if-no-files-found: error
