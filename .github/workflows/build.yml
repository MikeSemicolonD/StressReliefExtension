name: Build

# Reusable: tests, packages and lints the extension, then uploads the zip as
# the `extension` artifact. Called by CI (staging / PRs) and Release (main).
on:
  workflow_call:
    outputs:
      version:
        description: Version from manifest.json
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: version
        name: Read manifest version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # scripts/package.js holds the list of shipped files; the e2e tests load
      # the extension from the same list
      - name: Package
        run: node scripts/package.js pkg

      - name: Syntax check
        run: for f in pkg/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Two warnings are expected (Firefox ignores background.service_worker;
      # the Chrome-only chrome.dom call is feature-detected)
      - name: Lint for Firefox
        run: npx --yes web-ext@8 lint --source-dir pkg

      # The packaged folder itself: upload-artifact zips it, so downloading the
      # artifact gives a ready-to-upload extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: pkg/
          if-no-files-found: error
